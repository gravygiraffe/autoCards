<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{{ quiz.title }} · autoCards</title>
  <!--
    Multiple choice quiz page. Rendered by app.py (Flask/Jinja), which passes in `quiz`;
    the behaviour lives in static/quiz.js. The answer buttons are generated by that
    script and styled by the .option components in input.css.
  -->
  <script>
    // Runs before the page is drawn so it doesn't flash the wrong theme on load.
    (() => {
      const saved = localStorage.getItem("theme");
      const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='katex/katex.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page">
    <header class="site-header">
      <span class="w-10"></span>
      <h1 class="site-title"><a href="{{ url_for('home') }}">autoCards</a></h1>
      <button type="button" id="theme-btn" aria-label="Toggle dark mode" class="icon-btn">
        <svg class="size-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="hidden size-5 dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </header>

    <section class="mx-auto max-w-2xl">
      <div class="study-header">
        <a href="{{ url_for('home') }}" id="back-btn" class="back-link">Home</a>
        <h2 class="study-title">{{ quiz.title }}</h2>
        <span id="progress" class="position"></span>
      </div>

      <!-- One segment per question, generated by renderProgressBar() in common.js. Click or drag to jump between questions. -->
      <div id="progress-bar" role="slider" aria-label="Question position" tabindex="-1" class="progress-bar"></div>

      <!-- This round's score, and which questions to take -->
      <div class="toolbar">
        <span id="score" class="text-sm font-medium text-slate-600 tabular-nums dark:text-neutral-300"></span>
        <div class="filter-group flex">
          <button type="button" data-filter="all" class="filter-btn">All questions</button>
          <button type="button" data-filter="missed" class="filter-btn">Not correct yet</button>
        </div>
      </div>

      <div id="study">
        <!-- #question-stage slides when moving between questions -->
        <div id="question-stage">
          <div id="question-card" class="panel relative flex min-h-48 flex-col items-center justify-center px-6 pt-12 pb-8 sm:px-8">
            <span id="question-label" class="corner-label"></span>
            <span id="question-hint" class="corner-badge bg-slate-100 text-slate-500 dark:bg-neutral-700 dark:text-neutral-300"></span>
            <p id="question-prompt" class="text-center text-lg font-medium wrap-break-word whitespace-pre-line sm:text-xl"></p>
          </div>

          <!-- Answer buttons, generated by renderOptions() -->
          <div id="options" role="group" aria-labelledby="question-prompt" class="mt-4 grid gap-2"></div>

          <p id="feedback" aria-live="polite" class="feedback mt-4 min-h-6 text-center font-semibold"></p>
        </div>

        <div class="mt-3 grid grid-cols-4 gap-2">
          <button type="button" id="prev-btn" class="btn btn-control btn-secondary">&larr;<span class="hidden sm:inline"> Prev</span></button>
          <button type="button" id="check-btn" class="btn btn-control btn-primary">Check</button>
          <button type="button" id="shuffle-btn" class="btn btn-control btn-secondary">Shuffle</button>
          <button type="button" id="next-btn" class="btn btn-control btn-secondary"><span class="hidden sm:inline">Skip </span>&rarr;</button>
        </div>
        <p class="shortcuts">
          <span class="hidden sm:inline">A&ndash;D or 1&ndash;4 to choose &middot; Enter to check &middot; &larr; / &rarr; to navigate &middot; Esc to return</span>
          <span class="sm:hidden">Tap an answer, then Check</span>
        </p>
      </div>

      <!-- End of a round, or nothing left to answer -->
      <div id="done" class="panel hidden p-8 text-center">
        <p id="done-title" class="text-xl font-semibold"></p>
        <p id="done-score" class="mt-3 text-4xl font-bold tabular-nums"></p>
        <p id="done-summary" class="muted mt-2 text-sm"></p>
        <div class="button-row">
          <button type="button" id="review-btn" class="btn btn-muted">Review answers</button>
          <button type="button" id="retry-btn" class="btn btn-red">Retry missed questions</button>
          <button type="button" id="restart-btn" class="btn btn-primary">Restart quiz</button>
        </div>
      </div>

      <!-- Saved totals (most recent answer to each question) and reset -->
      <div class="totals flex">
        <span id="quiz-counts" class="muted"></span>
        <button type="button" id="reset-btn" class="link-danger">Reset progress for this quiz</button>
      </div>
      <p id="save-error" class="save-error hidden">Couldn't save progress &mdash; is app.py still running?</p>
    </section>
  </main>

  <script>
    // Filled in by Jinja: { id, title, date, questions: [{ prompt, options: [{ key, text }], correct: [key, ...] }] }
    const QUIZ = {{ quiz | tojson }};
  </script>
  <script src="{{ url_for('static', filename='katex/katex.min.js') }}"></script>
  <script src="{{ url_for('static', filename='common.js') }}"></script>
  <script src="{{ url_for('static', filename='quiz.js') }}"></script>
</body>
</html>
