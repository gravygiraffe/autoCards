<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>{{ quiz.title }} · autoCards</title>
  <!--
    Multiple choice quiz page. Rendered by app.py (Flask/Jinja), which passes in `quiz`;
    the behaviour lives in static/quiz.js. The answer buttons are generated by that
    script, so their classes are written out there.
  -->
  <script>
    // Runs before the page is drawn so it doesn't flash the wrong theme on load.
    (() => {
      const saved = localStorage.getItem("theme");
      const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='katex/katex.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="min-h-dvh bg-slate-100 text-slate-800 antialiased transition-colors dark:bg-neutral-900 dark:text-neutral-100">
  <main class="mx-auto max-w-3xl px-4 pt-6 pb-10 sm:pt-10">
    <header class="mb-6 flex items-center justify-between sm:mb-8">
      <span class="w-10"></span>
      <h1 class="text-3xl font-bold tracking-tight sm:text-4xl"><a href="{{ url_for('home') }}">autoCards</a></h1>
      <button type="button" id="theme-btn" aria-label="Toggle dark mode"
        class="flex size-10 cursor-pointer items-center justify-center rounded-full text-slate-600 hover:bg-slate-200 dark:text-neutral-300 dark:hover:bg-neutral-800">
        <svg class="size-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="hidden size-5 dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </header>

    <section class="mx-auto max-w-2xl">
      <div class="mb-3 flex items-center justify-between gap-2">
        <a href="{{ url_for('home') }}" id="back-btn" class="shrink-0 cursor-pointer rounded-lg bg-white px-3 py-1.5 text-sm font-medium text-indigo-600 shadow hover:bg-indigo-50 dark:bg-neutral-800 dark:text-neutral-200 dark:hover:bg-neutral-700">Home</a>
        <h2 class="min-w-0 truncate text-center text-lg font-semibold sm:text-xl">{{ quiz.title }}</h2>
        <span id="progress" class="shrink-0 text-sm text-slate-500 tabular-nums dark:text-neutral-400"></span>
      </div>

      <!-- One segment per question, generated by renderBar(). Click or drag to jump between questions. -->
      <div id="progress-bar" role="slider" aria-label="Question position" tabindex="-1"
        class="mb-2 flex h-5 w-full cursor-pointer touch-none items-center select-none"></div>

      <!-- This round's score, and which questions to take -->
      <div class="mb-4 flex min-h-8 items-center justify-between gap-2">
        <span id="score" class="text-sm font-medium text-slate-600 tabular-nums dark:text-neutral-300"></span>
        <div class="flex rounded-lg bg-slate-200 p-0.5 text-xs font-medium dark:bg-neutral-800">
          <button type="button" data-filter="all" class="filter-btn cursor-pointer rounded-md px-2.5 py-1 text-slate-500 dark:text-neutral-400">All questions</button>
          <button type="button" data-filter="missed" class="filter-btn cursor-pointer rounded-md px-2.5 py-1 text-slate-500 dark:text-neutral-400">Not correct yet</button>
        </div>
      </div>

      <div id="study">
        <!-- #question-stage slides when moving between questions -->
        <div id="question-stage">
          <div id="question-card" class="relative flex min-h-48 flex-col items-center justify-center rounded-2xl bg-white px-6 pt-12 pb-8 shadow-lg sm:px-8 dark:bg-neutral-800 dark:shadow-black/40">
            <span id="question-label" class="absolute top-3 left-4 text-xs font-semibold tracking-widest text-slate-400 uppercase sm:top-4 sm:left-5 dark:text-neutral-500"></span>
            <span id="question-hint" class="absolute top-3 right-4 rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-500 sm:top-4 sm:right-5 dark:bg-neutral-700 dark:text-neutral-300"></span>
            <p id="question-prompt" class="text-center text-lg font-medium break-words whitespace-pre-line sm:text-xl"></p>
          </div>

          <!-- Answer buttons, generated by renderOptions() -->
          <div id="options" role="group" aria-labelledby="question-prompt" class="mt-4 grid gap-2"></div>

          <p id="feedback" aria-live="polite" class="mt-4 min-h-6 text-center font-semibold"></p>
        </div>

        <div class="mt-3 grid grid-cols-4 gap-2">
          <button type="button" id="prev-btn" class="cursor-pointer rounded-lg bg-white px-3 py-3 font-medium shadow hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40 sm:py-2 dark:bg-neutral-800 dark:hover:bg-neutral-700">&larr;<span class="hidden sm:inline"> Prev</span></button>
          <button type="button" id="check-btn" class="cursor-pointer rounded-lg bg-indigo-600 px-3 py-3 font-medium text-white shadow hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-40 sm:py-2 dark:bg-neutral-200 dark:text-neutral-900 dark:hover:bg-white">Check</button>
          <button type="button" id="shuffle-btn" class="cursor-pointer rounded-lg bg-white px-3 py-3 font-medium shadow hover:bg-slate-50 sm:py-2 dark:bg-neutral-800 dark:hover:bg-neutral-700">Shuffle</button>
          <button type="button" id="next-btn" class="cursor-pointer rounded-lg bg-white px-3 py-3 font-medium shadow hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-40 sm:py-2 dark:bg-neutral-800 dark:hover:bg-neutral-700"><span class="hidden sm:inline">Skip </span>&rarr;</button>
        </div>
        <p class="mt-4 text-center text-xs text-slate-400 dark:text-neutral-500">
          <span class="hidden sm:inline">A&ndash;D or 1&ndash;4 to choose &middot; Enter to check &middot; &larr; / &rarr; to navigate &middot; Esc to return</span>
          <span class="sm:hidden">Tap an answer, then Check</span>
        </p>
      </div>

      <!-- End of a round, or nothing left to answer -->
      <div id="done" class="hidden rounded-2xl bg-white p-8 text-center shadow-lg dark:bg-neutral-800 dark:shadow-black/40">
        <p id="done-title" class="text-xl font-semibold"></p>
        <p id="done-score" class="mt-3 text-4xl font-bold tabular-nums"></p>
        <p id="done-summary" class="mt-2 text-sm text-slate-500 dark:text-neutral-400"></p>
        <div class="mt-5 flex flex-wrap justify-center gap-2">
          <button type="button" id="review-btn" class="cursor-pointer rounded-lg bg-slate-100 px-4 py-2 font-medium hover:bg-slate-200 dark:bg-neutral-700 dark:hover:bg-neutral-600">Review answers</button>
          <button type="button" id="retry-btn" class="cursor-pointer rounded-lg bg-red-100 px-4 py-2 font-medium text-red-800 hover:bg-red-200 dark:bg-red-400/15 dark:text-red-300 dark:hover:bg-red-400/25">Retry missed questions</button>
          <button type="button" id="restart-btn" class="cursor-pointer rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white shadow hover:bg-indigo-700 dark:bg-neutral-200 dark:text-neutral-900 dark:hover:bg-white">Restart quiz</button>
        </div>
      </div>

      <!-- Saved totals (most recent answer to each question) and reset -->
      <div class="mt-6 flex flex-col items-center gap-1 text-xs">
        <span id="quiz-counts" class="text-slate-500 dark:text-neutral-400"></span>
        <button type="button" id="reset-btn" class="cursor-pointer text-slate-400 underline-offset-2 hover:text-red-600 hover:underline dark:text-neutral-500 dark:hover:text-red-400">Reset progress for this quiz</button>
      </div>
      <p id="save-error" class="mt-2 hidden text-center text-xs text-red-600 dark:text-red-400">Couldn't save progress &mdash; is app.py still running?</p>
    </section>
  </main>

  <script>
    // Filled in by Jinja: { id, title, date, questions: [{ prompt, options: [{ key, text }], correct: [key, ...] }] }
    const QUIZ = {{ quiz | tojson }};
  </script>
  <script src="{{ url_for('static', filename='katex/katex.min.js') }}"></script>
  <script src="{{ url_for('static', filename='common.js') }}"></script>
  <script src="{{ url_for('static', filename='quiz.js') }}"></script>
</body>
</html>
